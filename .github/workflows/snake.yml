name: generate animation

on:
  schedule:
    # Todo dia à meia-noite (UTC) — a cobrinha "come" o dia mais recente do
    # gráfico de contribuições assim que ele existir.
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: gera o SVG da cobrinha
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: cardosodan
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
